name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Compile backend
        run: python -m compileall -q .
      - name: Unit tests
        run: pytest ../tests/unit -q
      - name: True pipeline E2E
        run: pytest ../tests/integration/test_true_pipeline_e2e.py -q

  frontend:
    name: Frontend lint, typecheck, test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Tests
        run: npm test
      - name: Production build
        run: npm run build

  security:
    name: Dependency security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: python -m pip install --upgrade pip-audit
      - name: Audit backend requirements
        run: pip-audit -r backend/requirements.txt --no-deps

  evaluation-gate:
    name: Ranking regression gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce gate when benchmark is validated
        shell: bash
        run: |
          status=$(python - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path("docs/evaluation/benchmark_status.json").read_text())["status"])
          PY
          )
          if [ "$status" != "validated" ]; then
            echo "Benchmark status is '$status'; regression gate is not yet enforceable."
            exit 0
          fi
          test -f docs/evaluation/baseline.json
          test -f docs/evaluation/latest.json
          python scripts/ranking_regression_gate.py             --baseline docs/evaluation/baseline.json             --latest docs/evaluation/latest.json             --policy docs/evaluation/regression_policy.json

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
