name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Compile backend
        run: python -m compileall -q .
      - name: Unit tests
        run: pytest ../tests/unit -q
      - name: True pipeline E2E
        run: pytest ../tests/integration/test_true_pipeline_e2e.py -q

  frontend:
    name: Frontend lint, typecheck, test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Runtime dependency audit
        run: npm audit --omit=dev --audit-level=high

  security:
    name: Dependency security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: python -m pip install --upgrade pip-audit
      - name: Audit backend requirements
        run: pip-audit -r backend/requirements.txt --no-deps

  benchmark-validation:
    name: Validate ranking benchmark structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate benchmark
        run: |
          python scripts/validate_benchmark.py \
            docs/evaluation/golden_job_ranking_v1.jsonl \
            --manifest /tmp/benchmark-manifest.json

  evaluation-gate:
    name: Synthetic benchmark reference comparison (non-production)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare frozen synthetic reference metrics (plumbing only)
        shell: bash
        run: |
          test -f docs/evaluation/baseline.json
          test -f docs/evaluation/latest.json
          python scripts/ranking_regression_gate.py \
            --baseline docs/evaluation/baseline.json \
            --latest docs/evaluation/latest.json \
            --policy docs/evaluation/regression_policy.json \
            --allow-non-production-baseline


  human-benchmark:
    name: Source benchmark diagnostic (non-authoritative)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install evaluation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt
      - name: Build diagnostic scoreboard from repository source workbook
        run: |
          python scripts/evaluate_human_benchmark.py \
            docs/evaluation/Human_Benchmark_Labeled_v1.xlsx \
            --output-dir /tmp/master-scoreboard
      - name: Upload scoreboard artifacts
        uses: actions/upload-artifact@v4
        with:
          name: source-benchmark-diagnostic
          path: /tmp/master-scoreboard/
