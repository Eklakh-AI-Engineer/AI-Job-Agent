name: Frontend Live Integration QA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-api:
    name: Live backend integration smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      LIVE_API_URL: ${{ secrets.LIVE_API_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Validate live API URL
        run: test -n "$LIVE_API_URL"
      - name: Install dependencies
        run: npm ci
      - name: Run live API smoke tests
        run: npm run test:live

  live-frontend:
    name: Live frontend shell smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Validate frontend URL
        run: test -n "$FRONTEND_URL"
      - name: Install dependencies
        run: npm ci
      - name: Run live frontend smoke test
        run: npm run test:live:frontend
