name: Frontend Live Integration QA

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/frontend-live-qa.yml"
      - "frontend/tests/live-api.test.mjs"
      - "frontend/tests/live-frontend.test.mjs"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "backend/app/core/config.py"
      - "backend/app/core/database.py"
      - "tests/unit/test_config.py"
  workflow_dispatch:
    inputs:
      api_url:
        description: "Optional HTTPS API URL override (otherwise LIVE_API_URL secret is used)"
        required: false
        type: string
      frontend_url:
        description: "Optional HTTPS frontend URL override (otherwise FRONTEND_URL secret is used)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  live-api:
    name: Live backend integration smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      LIVE_API_URL: ${{ inputs.api_url || secrets.LIVE_API_URL || 'https://ai-job-agent-api-mu.vercel.app' }}
      LIVE_QA_EMAIL: ${{ secrets.LIVE_QA_EMAIL }}
      LIVE_QA_PASSWORD: ${{ secrets.LIVE_QA_PASSWORD }}
      JOB_EXPORT_PATH: ../artifacts/live-qa/production-jobs.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Validate live API URL
        run: |
          if [ -z "$LIVE_API_URL" ]; then
            echo "::error::Set a verified API URL in the Actions secret or workflow_dispatch input."
            exit 1
          fi
          case "$LIVE_API_URL" in https://*) ;; *) echo "::error::LIVE_API_URL must start with https://"; exit 1 ;; esac
      - name: Install dependencies
        run: npm ci
      - name: Explain authenticated smoke prerequisites
        if: env.LIVE_QA_EMAIL == '' || env.LIVE_QA_PASSWORD == ''
        run: echo '::warning::Authenticated production smoke is skipped until LIVE_QA_EMAIL and LIVE_QA_PASSWORD repository secrets are configured.'
      - name: Run live API smoke tests
        run: |
          mkdir -p ../artifacts/live-qa
          npm run test:live
      - name: Upload sanitized production job export
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sanitized-production-job-export
          path: artifacts/live-qa/production-jobs.json
          if-no-files-found: warn
          retention-days: 30

  live-frontend:
    name: Live frontend shell smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      FRONTEND_URL: ${{ inputs.frontend_url || secrets.FRONTEND_URL || 'https://ai-job-agent-theta.vercel.app' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Validate frontend URL
        run: |
          if [ -z "$FRONTEND_URL" ]; then
            echo "::error::Set a verified frontend URL in the Actions secret or workflow_dispatch input."
            exit 1
          fi
          case "$FRONTEND_URL" in https://*) ;; *) echo "::error::FRONTEND_URL must start with https://"; exit 1 ;; esac
      - name: Install dependencies
        run: npm ci
      - name: Run live frontend smoke test
        run: npm run test:live:frontend
