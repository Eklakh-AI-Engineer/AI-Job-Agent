name: Production monitoring smoke

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "Optional HTTPS API URL override (otherwise LIVE_API_URL secret is used)"
        required: false
        type: string
      frontend_url:
        description: "Optional HTTPS frontend URL override (otherwise FRONTEND_URL secret is used)"
        required: false
        type: string
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/production-monitoring.yml"
      - "backend/app/core/config.py"
      - "backend/app/core/database.py"
      - "frontend/tests/live-api.test.mjs"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Validate production URLs are configured
        env:
          LIVE_API_URL: ${{ inputs.api_url || secrets.LIVE_API_URL || 'https://ai-job-agent-api-mu.vercel.app' }}
          FRONTEND_URL: ${{ inputs.frontend_url || secrets.FRONTEND_URL || 'https://ai-job-agent-theta.vercel.app' }}
        run: |
          if [ -z "$LIVE_API_URL" ] || [ -z "$FRONTEND_URL" ]; then
            echo "::error::Production monitoring requires verified HTTPS URLs. Supply them as Actions secrets or manual workflow inputs."
            exit 1
          fi
          case "$LIVE_API_URL" in https://*) ;; *) echo "::error::LIVE_API_URL must start with https://"; exit 1 ;; esac
          case "$FRONTEND_URL" in https://*) ;; *) echo "::error::FRONTEND_URL must start with https://"; exit 1 ;; esac
      - name: Backend health
        env:
          LIVE_API_URL: ${{ inputs.api_url || secrets.LIVE_API_URL || 'https://ai-job-agent-api-mu.vercel.app' }}
        run: |
          for attempt in 1 2 3 4 5; do
            response="$(curl --fail --silent --show-error --max-time 20 "$LIVE_API_URL/health?release_audit_probe=$attempt")"
            echo "$response" | python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("status") == "ok"; assert d.get("database") == "healthy"; print("health probe: ok; database: healthy")'
          done
      - name: Backend metrics
        env:
          LIVE_API_URL: ${{ inputs.api_url || secrets.LIVE_API_URL || 'https://ai-job-agent-api-mu.vercel.app' }}
        run: |
          curl --fail --silent --show-error --max-time 20 "$LIVE_API_URL/metrics" | grep -q "http_requests_total"
      - name: Frontend shell
        env:
          FRONTEND_URL: ${{ inputs.frontend_url || secrets.FRONTEND_URL || 'https://ai-job-agent-theta.vercel.app' }}
        run: |
          curl --fail --silent --show-error --max-time 20 "$FRONTEND_URL/" | grep -qi "<html"
