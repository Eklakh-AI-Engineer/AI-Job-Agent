name: Real ATS Dry-Run Validation

on:
  push:
    branches: [main]
    paths:
      - "backend/app/agents/**"
      - "backend/app/services/browser_automation_service.py"
      - "scripts/validate_real_ats.py"
      - "backend/requirements*.txt"
      - ".github/workflows/real-ats-validation.yml"

jobs:
  lever-dry-run:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Validate current public Lever application pages without submission
        run: |
          mkdir -p ../artifacts/real-ats
          python ../scripts/validate_real_ats.py \
            --url "https://jobs.lever.co/Onehouse/47c14505-7b3e-4e6e-9e8d-04b41a8788a8" \
            --url "https://jobs.lever.co/Onehouse/2e0958a7-d86e-4b9e-9f81-b18bdf47f157" \
            --output ../artifacts/real-ats/dry-run-results.json

      - name: Upload ATS dry-run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-ats-dry-run-evidence
          path: artifacts/real-ats/dry-run-results.json
          if-no-files-found: warn
          retention-days: 90
