apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-job-agent-api
  labels:
    app: ai-job-agent-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-job-agent-api
  template:
    metadata:
      labels:
        app: ai-job-agent-api
    spec:
      containers:
        - name: api
          image: ghcr.io/OWNER/ai-job-agent:latest
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: ai-job-agent-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
