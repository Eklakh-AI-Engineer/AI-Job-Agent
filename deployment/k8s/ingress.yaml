apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-job-agent-ingress
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts: ["api.aijobagent.example.com"]
      secretName: ai-job-agent-tls
  rules:
    - host: api.aijobagent.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ai-job-agent-api
                port:
                  number: 80
