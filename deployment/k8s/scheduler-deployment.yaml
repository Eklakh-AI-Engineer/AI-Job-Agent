apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-job-agent-scheduler
  labels:
    app: ai-job-agent-scheduler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-job-agent-scheduler
  template:
    metadata:
      labels:
        app: ai-job-agent-scheduler
    spec:
      containers:
        - name: scheduler
          image: ghcr.io/OWNER/ai-job-agent:latest
          command: ["celery", "-A", "app.core.celery_app", "beat", "--loglevel=INFO", "--scheduler=celery.beat.PersistentScheduler"]
          envFrom:
            - secretRef:
                name: ai-job-agent-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"