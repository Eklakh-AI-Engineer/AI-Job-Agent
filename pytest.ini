[pytest]
# Phase 3: unit + integration (SQLite-backed for determinism) by default.
# Real-Postgres integration tests live under ``tests/integration_pg/`` and
# only run when ``DATABASE_URL`` is set. Run them explicitly:
#   pytest tests/integration_pg -m postgres
# CI does this against the job's Postgres service in a dedicated step.
testpaths = tests/unit tests/integration
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    asyncio: marks tests as async
    integration: exercises the FastAPI application over HTTP
    e2e: requires the full running stack (excluded from the default run)
    postgres: requires a real PostgreSQL database; auto-skips without DATABASE_URL
