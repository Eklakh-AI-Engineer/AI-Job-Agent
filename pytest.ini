[pytest]
# Phase 3: unit + integration. e2e/ stays excluded until the full stack
# (Postgres + Redis + worker) can be brought up deterministically in CI.
testpaths = tests/unit tests/integration
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    asyncio: marks tests as async
    integration: exercises the FastAPI application over HTTP
    e2e: requires the full running stack (excluded from the default run)
